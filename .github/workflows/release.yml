name: Release Anim

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-version:
    name: Verify stable version and canonical source
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.9.15'
          enable-cache: false
      - name: Require a tagged commit already on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Require the exact stable package version
        id: version
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version) is None:
              raise SystemExit('Publication requires a stable major.minor.patch version')
          if os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit('Tag and package version do not match')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY

  validate:
    name: Validate exact release artifacts
    needs: release-version
    uses: ./.github/workflows/checks.yml

  publish-pypi:
    name: Publish validated distributions to PyPI
    needs: [release-version, validate]
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/project/anim/${{ needs.release-version.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-distributions
          path: dist
      - name: Publish exact validated distributions with trusted identity
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    name: Publish matching GitHub Release and checksums
    needs: publish-pypi
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-distributions
          path: dist
      - name: Extract version notes and checksum exact distributions
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          version = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          changelog = Path('CHANGELOG.md').read_text()
          marker = f'\n## {version} - '
          if changelog.count(marker) != 1:
              raise SystemExit('Missing or ambiguous release notes')
          section = changelog.split(marker, 1)[1].split('\n', 1)[1].split('\n## ', 1)[0]
          if not section.strip():
              raise SystemExit('Release notes are empty')
          Path('release-notes.md').write_text(section.strip() + '\n')
          artifacts = sorted(Path('dist').glob('*'))
          expected = [f'anim-{version}-py3-none-any.whl', f'anim-{version}.tar.gz']
          if [p.name for p in artifacts] != expected:
              raise SystemExit('Unexpected release artifacts')
          Path('SHA256SUMS').write_text(''.join(
              f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in artifacts
          ))
          PY
      - name: Create matching GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --notes-file release-notes.md --title "Anim ${GITHUB_REF_NAME#v}"
