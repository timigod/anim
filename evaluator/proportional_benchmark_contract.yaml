      schema_ref: "schemas/evaluator-receipts.schema.json#/$defs/PublicBatchCasePlan"
      schema_version: "ebm-audit-public-batch-case-plan/1.0"
      natural_identity_fields: ["benchmark_subject_digest", "authenticated_batch_sha256", "case_ordinal", "case_id"]
      required_fields: ["schema_version", "digest_state", "benchmark_subject_digest", "authenticated_batch_sha256", "batch_context_sha256", "case_ordinal", "case_id", "family_id", "source_variant_id", "replicate_index", "input_owner_digest", "truth_evidence_digest", "public_batch_case_plan_sha256"]
