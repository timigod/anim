  case_identity_fields: ["benchmark_subject_digest", "authenticated_batch_sha256", "case_id"]
  case_operation_join_key_fields: ["benchmark_subject_digest", "authenticated_batch_sha256", "case_id", "operation_instance_id"]
  ordinal_rule: "case_ordinal and operation_ordinal preserve authenticated plan order. They must equal their owning plan records and never replace case identity or the complete case_operation_join_key."
  join_rule: "The first three case_operation_join_key fields must equal one genuine PUBLIC_BATCH_CASE_PLAN case identity. Every plan entry and executed owner uses that complete shared key."
  required_cardinalities: ["EXACTLY_ONE", "ONE_PER_CASE", "ONE_PER_PLANNED_CASE", "ONE_PER_SUBTYPE_CASE", "ONE_PER_DECLARED_RULE", "ONE_PER_OPPORTUNITY"]
  owner_bindings:
