  children:
    - {child_id: "known_truth_recovery", family_ids: ["easy_known_truth", "moderate_mina_shape"], evidence_owner: "KnownTruthRecoveryReceipt", evidence_schema_ref: "schemas/proportional-readiness-contract.schema.json#/$defs/HardGateEvidence", validation_rule: "The authenticated central order and fixed-cohort stages satisfy the predeclared synthetic truth rules.", failure_code: "SCIENCE.KNOWN_TRUTH_NOT_RECOVERED"}
    - {child_id: "signal_degradation", family_ids: ["noise_ladder", "weak_pre_post_separation", "incomplete_time_coverage", "small_sample"], evidence_owner: "SignalDegradationReceipt", evidence_schema_ref: "schemas/proportional-readiness-contract.schema.json#/$defs/HardGateEvidence", validation_rule: "The predeclared matched comparisons show no increase in certainty as signal weakens, coverage narrows, or sample size falls.", failure_code: "SCIENCE.DEGRADATION_DIRECTION_WRONG"}
    - {child_id: "non_identifiability", family_ids: ["opposing_sequences_50_50", "near_simultaneous_events", "minority_alternate_sequence"], evidence_owner: "NonIdentifiabilityReceipt", evidence_schema_ref: "schemas/proportional-readiness-contract.schema.json#/$defs/HardGateEvidence", validation_rule: "Non-identifiable and partial-order truths remain explicitly uncertain and do not become one confident total order.", failure_code: "SCIENCE.NON_IDENTIFIABILITY_HIDDEN"}
    - {child_id: "outlier_sensitivity", family_ids: ["outlier_sabotage"], evidence_owner: "OutlierSensitivityReceipt", evidence_schema_ref: "schemas/proportional-readiness-contract.schema.json#/$defs/HardGateEvidence", validation_rule: "The complete baseline and eight-removal comparison exposes the injected outlier effect.", failure_code: "SCIENCE.OUTLIER_SENSITIVITY_MISSED"}
    - {child_id: "missingness_sensitivity", family_ids: ["mcar_missingness", "mar_missingness"], evidence_owner: "MissingnessSensitivityReceipt", evidence_schema_ref: "schemas/proportional-readiness-contract.schema.json#/$defs/HardGateEvidence", validation_rule: "MCAR and declared MAR handling remain distinct, counted, provenance-bound, and scientifically visible.", failure_code: "SCIENCE.MISSINGNESS_SENSITIVITY_MISSED"}
    - {child_id: "participant_influence", family_ids: ["outlier_sabotage"], evidence_owner: "ParticipantInfluenceReceipt", evidence_schema_ref: "schemas/proportional-readiness-contract.schema.json#/$defs/HardGateEvidence", validation_rule: "The complete leave-one-out result identifies the injected influential participant without exposing participant data.", failure_code: "SCIENCE.PARTICIPANT_INFLUENCE_MISSED"}
    - {child_id: "duplicated_and_correlated_features", family_ids: ["correlated_duplicate_events"], evidence_owner: "DuplicateFeatureReceipt", evidence_schema_ref: "schemas/proportional-readiness-contract.schema.json#/$defs/HardGateEvidence", validation_rule: "All six correlated and six exact-duplicate operations preserve subtype identity and apply the predeclared partial-truth and language rules.", failure_code: "SCIENCE.DUPLICATE_FEATURE_BEHAVIOR_WRONG"}
    - {child_id: "row_invariance", family_ids: ["*"], evidence_owner: "RowInvarianceReceipt", evidence_schema_ref: "schemas/proportional-readiness-contract.schema.json#/$defs/HardGateEvidence", validation_rule: "A predeclared row permutation leaves identifier-joined canonical scientific results unchanged.", failure_code: "SCIENCE.ROW_INVARIANCE_FAILED"}
    - {child_id: "column_invariance", family_ids: ["*"], evidence_owner: "ColumnInvarianceReceipt", evidence_schema_ref: "schemas/proportional-readiness-contract.schema.json#/$defs/HardGateEvidence", validation_rule: "A predeclared feature-column permutation with matching identifiers leaves canonical scientific results unchanged.", failure_code: "SCIENCE.COLUMN_INVARIANCE_FAILED"}
    - {child_id: "identifier_invariance", family_ids: ["*"], evidence_owner: "IdentifierInvarianceReceipt", evidence_schema_ref: "schemas/proportional-readiness-contract.schema.json#/$defs/HardGateEvidence", validation_rule: "A bijective identifier relabelling leaves canonical scientific results unchanged and positional joining remains rejected.", failure_code: "SCIENCE.IDENTIFIER_INVARIANCE_FAILED"}
    - {child_id: "different_seed_behavior", family_ids: ["easy_known_truth", "noise_ladder"], evidence_owner: "DifferentSeedReceipt", evidence_schema_ref: "schemas/proportional-readiness-contract.schema.json#/$defs/HardGateEvidence", validation_rule: "Predeclared stochastic fields differ under a distinct derived seed while deterministic identities and interpretation rules remain stable.", failure_code: "SCIENCE.DIFFERENT_SEED_BEHAVIOR_WRONG"}
    - {child_id: "small_event_oracle_agreement", family_ids: ["easy_known_truth", "tightly_spaced_events"], evidence_owner: "SmallEventOracleReceipt", evidence_schema_ref: "schemas/proportional-readiness-contract.schema.json#/$defs/HardGateEvidence", validation_rule: "Applicable small-event ordering and stage calculations agree with the exact or exhaustive oracle under the declared tolerance.", failure_code: "SCIENCE.ORACLE_DISAGREEMENT"}
    - {child_id: "burn_in_handling", family_ids: ["*"], evidence_owner: "BurnInHandlingReceipt", evidence_schema_ref: "schemas/proportional-readiness-contract.schema.json#/$defs/HardGateEvidence", validation_rule: "Only post-burn-in samples contribute to every supported posterior summary.", failure_code: "SCIENCE.BURN_IN_HANDLING_WRONG"}
    - {child_id: "thinning_handling", family_ids: ["*"], evidence_owner: "ThinningHandlingReceipt", evidence_schema_ref: "schemas/proportional-readiness-contract.schema.json#/$defs/HardGateEvidence", validation_rule: "The declared thinning schedule selects exactly the expected sample indices once.", failure_code: "SCIENCE.THINNING_HANDLING_WRONG"}
    - {child_id: "event_index_handling", family_ids: ["easy_known_truth", "correlated_duplicate_events"], evidence_owner: "EventIndexHandlingReceipt", evidence_schema_ref: "schemas/proportional-readiness-contract.schema.json#/$defs/HardGateEvidence", validation_rule: "Zero-based event permutations and event identifiers round-trip without off-by-one or identity substitution.", failure_code: "SCIENCE.EVENT_INDEX_HANDLING_WRONG"}
    - {child_id: "stage_index_handling", family_ids: ["easy_known_truth"], evidence_owner: "StageIndexHandlingReceipt", evidence_schema_ref: "schemas/proportional-readiness-contract.schema.json#/$defs/HardGateEvidence", validation_rule: "Stage indices include the declared pre-event stage and map exactly to fixed-cohort posterior columns.", failure_code: "SCIENCE.STAGE_INDEX_HANDLING_WRONG"}

