      issuance_rule: "Issue from retained exact case context with unique contiguous zero-based case ordinals. Do not sort or reconstruct from dictionary order, filenames, result arrival, or caller input."
      prohibition: "Authenticates shared case identity only. It does not issue an operation plan or claim that an operation executed."
    proportional_operation_plan:
      owner_class: "PROPORTIONAL_OPERATION_PLAN"
      schema_ref: "schemas/evaluator-receipts.schema.json#/$defs/ProportionalOperationPlan"
      schema_version: "ebm-audit-proportional-operation-plan/1.0"
      natural_identity_fields: ["benchmark_subject_digest", "contract_sha256", "authenticated_batch_sha256", "proportional_operation_plan_sha256"]
      expected_fit_count: 104
      authority: "authenticated public planning authority"
      issuance_rule: "Issue before execution with the exact ordered operation IDs, ordinals, case identities, complete case_operation_join_keys, structured entry hashes, applicable family/member/pair/analysis/transformation/resample/removal/refit/source/output/parameter identities, and the structured plan digest."
      prohibition: "Do not include or infer executed row memberships, observed removals, returned results, terminal states, fitted parameters, actual transformation accounting, or claims that a planned operation ran."
    public_terminal_result:
      owner_class: "PUBLIC_TERMINAL_RESULT"
      schema_ref: "schemas/evaluator-receipts.schema.json#/$defs/PublicTerminalResult"
      schema_version: "ebm-audit-public-terminal-result/1.0"
      natural_identity_fields: ["benchmark_subject_digest", "authenticated_batch_sha256", "case_id", "operation_instance_id"]
      required_fields: ["schema_version", "digest_state", "benchmark_subject_digest", "authenticated_batch_sha256", "captured_run_sha256", "case_id", "family_id", "proportional_operation_plan_sha256", "operation_plan_entry_sha256", "operation_ordinal", "operation_instance_id", "case_operation_join_key", "terminal_status", "reason_code", "backend_invoked", "fit_response_binding_sha256", "canonical_scientific_payload_sha256", "finalized_result_record_sha256", "terminal_record_sha256", "public_terminal_result_sha256"]
