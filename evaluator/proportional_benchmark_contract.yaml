      additional_direct_evidence: ["reference-fit population", "group-role evidence", "canonical payload", "result", "warning", "side effect"]
      required_join_fields: ["case_operation_join_key", "proportional_operation_plan_sha256", "operation_plan_entry_sha256"]
      rule: "Preparation and capture authorities issue direct executed records and compare both plan hashes with the genuine pre-execution plan. A preparation audit digest supports these records but never replaces their exact facts."
  lifecycle_meanings:
    planned_case_ids: "Consume every PUBLIC_BATCH_CASE_PLAN owner in authenticated case_ordinal order."
    valid_case_ids: "For every planned case, resolve all matching PROPORTIONAL_OPERATION_PLAN entries and left-join exactly one PUBLIC_TERMINAL_RESULT by complete case_operation_join_key and exact plan-entry hash. Emit the case ID only when every required operation has one schema-valid terminal satisfying the frozen valid-result rule. Preserve the planned denominator and visible failure state."
  report_transaction:
    pre_render_identity_field: "report_claim_projection_sha256"
    pre_render_projection_schema_ref: "schemas/scenario-evidence.schema.json#/$defs/AuthenticatedReportClaimProjection"
    report_predicate_natural_identity_fields: ["benchmark_subject_digest", "family_id", "predicate_id", "cardinality_member_id", "report_claim_projection_sha256"]
    ordered_steps:
      - "Assemble all non-report meanings with genuine WARNING_RECORD and per-operation PUBLIC_TERMINAL_RESULT evidence into one pre-report derivation set."
      - "Issue one genuine pre-render report-model and claim projection from that set and the frozen report-rule registry. It contains no rendered artifact or report-artifact hash."
      - "Derive REPORT_PREDICATE_OUTCOME and every report-predicate, warning, and terminal meaning from that exact projection and their registered genuine owners."
      - "Assemble and digest the final ordered 104-meaning bundle."
      - "Render JSON, applicable CSV, and self-contained HTML exactly once from the final bundle."
      - "Read back every surface and issue one ReportSurfaceVerificationReceipt that compares all applicable meanings, states, typed values, warnings, terminals, claims, and artifact hashes."
    surface_receipt_schema_ref: "schemas/evaluator-receipts.schema.json#/$defs/ReportSurfaceVerificationReceipt"
    cycle_rule: "The surface receipt is terminal hard-gate evidence only. It must not re-enter the source-owner manifest, alter a meaning, or cause a second render."
  systemic_repair_rules:
    - "Consume every registered required owner slot. An unused required owner is a contract failure even when another owner contains a similar field or digest."
    - "Before any field read, dispatch by validated owner_class and validate the exact schema, natural identity, structured self-digest, retained capability readback, support closure, selector, and cardinality."
    - "Never use default true, default false, default zero, count-only success, non-empty-string truthiness, or digest presence as a scientific value."
    - "Never reduce a SHA-256 digest to a Boolean. Equality requires the exact registered preimages and identities."
    - "A required WARN or NOT_ASSESSABLE outcome makes the family not assessable and never becomes true, false, zero, pass, or AVAILABLE evidence."
    - "Join comparator and payload evidence by complete subject, comparator, source-variant, replicate, pair, member, operation, result, payload, chain, and case identities. Tuple position is not identity."
    - "Join plan and result evidence to the complete authenticated operation plan, preserve planned denominators, and enforce every required cardinality exactly."
    - "Validate private-array member name, dtype, shape, axes, semantic version, artifact and value digests, event and row identities, and chain order before reading values."
    - "Dispatch preparation, preprocessing, row-manifest, reference-fit, and accounting owners by type; join row instances by source_row_index and occurrence_ordinal; prove input equals retained plus declared removals with multiplicity."
    - "Bind transformations to exact source and output cases, parameters, operation identity, axes, values, missingness, labels, covariates, and DataAccounting."
    - "Verify the exact typed audit-result value and its JSON, applicable CSV, and self-contained HTML representations."
    - "Missing, malformed, non-finite, cross-bound, duplicate, incomplete, or non-comparable evidence follows registered failure behavior and never emits a success value."

challenge:
  profile_id: "proportional-readiness-challenge/0.2.3"
  attempt_limit_per_candidate: 1
  candidate_count: 1
  fresh_seed_root_bits: 256
  fit_ceiling: 104
  nominal_wall_clock_target_seconds: 9600
  terminal_wall_clock_timeout_seconds: 10500
  fit_invocation_timeout_seconds: 300
  parallel_fit_limit: 4
  non_fit_allowance_seconds: 1800
  terminal_variance_allowance_seconds: 900
  time_derivation: "ceil(104 / 4) * 300 seconds plus 1800 seconds for preparation, validation, reports, and receipt = 9600 seconds; the terminal timeout adds 900 seconds of host variance for 10500 seconds."
  operation_id_rule: "Use family_id + '/' + member_id in family order and member order. Moderate member_id is pair_{00..23}/{signal|matched_pure_no_signal}, so its exact operation ID is moderate_mina_shape/pair_{00..23}/{signal|matched_pure_no_signal}."
