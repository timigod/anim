      captured_run_rule: "captured_run_sha256 is required terminal provenance outside the natural identity and must equal the exact issuing run."
      success_rule: "Success requires non-null Fit-response and canonical-payload bindings. A pre-backend or failed terminal retains exact status, reason, and invocation state and does not invent success-only bindings."
      comparator_rule: "Every comparator member, replicate, pair, transformation, removal, refit, or analysis operation consumes its own terminal. A case-level terminal or one successful member cannot substitute for another planned operation."
