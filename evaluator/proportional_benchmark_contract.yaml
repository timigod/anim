corrective_amendment_0_2_3:
  scope: "Correct the impossible ordinary operation/owner identities for mcar_missingness:/payload/preprocessing_refit_equal, mar_missingness:/payload/silent_loss_flags, and covariate_confounding:/payload/resample_leakage_count. Preserve their output types, scientific rules, and failure behaviors. Preserve the other 101 meaning identities and every unrelated challenge fact."
  corrected_meaning_ids: ["mcar_missingness:/payload/preprocessing_refit_equal", "mar_missingness:/payload/silent_loss_flags", "covariate_confounding:/payload/resample_leakage_count"]
  meaning_id: "mcar_missingness:/payload/preprocessing_refit_equal"
  derivation_id: "complete-preprocessing-refit-equality/1"
  output_schema_ref: "schemas/scenario-family-payload.schema.json#/$defs/McarEvidence/properties/preprocessing_refit_equal"
  supersedes_unaccepted_candidate_version: "0.2.2"
  preserved_scientific_rule: "Emit true only when the genuine ordered SOURCE then TRANSFORMED complete-refit executions have the exact six ordered steps, bind their own input, seed, role-specific plan entry, operation, and training or reference population, and have equal refit-procedure digests. This compares procedure, not fitted parameter values."
  corrected_ordered_owner_slots:
    - {owner_class: "PROPORTIONAL_OPERATION_PLAN", cardinality: "EXACTLY_ONE", selector: "authenticated-proportional-operation-plan/1"}
    - {owner_class: "PREPROCESSING_EXECUTION_RECORD", cardinality: "ONE_PER_CASE", selector: "same-case-source-complete-refit/1", execution_role: "SOURCE"}
    - {owner_class: "PREPROCESSING_EXECUTION_RECORD", cardinality: "ONE_PER_CASE", selector: "same-case-transformed-complete-refit/1", execution_role: "TRANSFORMED"}
  direct_owner_schema:
    schema_ref: "schemas/scenario-evidence.schema.json#/$defs/ExecutedPreprocessingExecutionRecord"
    schema_version: "ebm-audit-preprocessing-execution-record/3.0"
    natural_identity_fields: ["case_operation_join_key", "execution_role", "proportional_operation_plan_sha256", "operation_plan_entry_sha256"]
    required_role_values: ["SOURCE", "TRANSFORMED"]
    required_refit_mode: "complete_refit"
    required_execution_fields: ["component_seed_manifest_sha256", "reference_fit_row_manifest_sha256", "refit_procedure_sha256", "ordered_step_records"]
    exact_ordered_step_count: 6
  ordered_operation_member_ids: ["source_refit", "transformed_refit"]
  ordered_execution_roles: ["SOURCE", "TRANSFORMED"]
  pair_binding_rule: "The authenticated proportional plan contains two distinct ordered MCAR entries for the same comparison case. SOURCE is first and TRANSFORMED is second. Each execution record binds its own operation ID, operation ordinal, complete case_operation_join_key, and operation_plan_entry_sha256. Both records bind the same proportional_operation_plan_sha256, benchmark subject, authenticated batch, family, and comparison case_id. Their operation IDs, ordinals, join keys, and plan-entry hashes differ. Authenticate both entries before comparing procedure digests."
  fail_closed_rule: "One PREPARATION_AUDIT_EVIDENCE owner cannot satisfy either direct role or both roles. Exactly one genuine role-bound PREPROCESSING_EXECUTION_RECORD is required for SOURCE and exactly one is required for TRANSFORMED. Missing, duplicate, same-role, reordered-role, same-operation, same-entry, cross-plan, cross-case, or malformed role evidence is not assessable and fails the rule."
  row_role_manifest_corrections:
    ordered_roles: ["INPUT", "TRAINING", "OUTPUT", "REFERENCE_FIT"]
    ordered_manifest_slots:
      - {owner_class: "PREPARATION_ROW_INSTANCE_MANIFEST", cardinality: "ONE_PER_CASE", selector: "same-case-input-row-instance-manifest/1"}
      - {owner_class: "PREPARATION_ROW_INSTANCE_MANIFEST", cardinality: "ONE_PER_CASE", selector: "same-case-training-row-instance-manifest/1"}
      - {owner_class: "PREPARATION_ROW_INSTANCE_MANIFEST", cardinality: "ONE_PER_CASE", selector: "same-case-output-row-instance-manifest/1"}
      - {owner_class: "PREPARATION_ROW_INSTANCE_MANIFEST", cardinality: "ONE_PER_CASE", selector: "same-case-reference-fit-row-instance-manifest/1"}
    meaning_ids: ["mar_missingness:/payload/silent_loss_flags", "covariate_confounding:/payload/resample_leakage_count"]
    selector_rule: "Each corrected meaning consumes exactly one same-case manifest for each canonical role in the declared order. A combined all-role selector, missing role, duplicate role, reordered role, or role substitution is invalid."
  preserved_counts: {meaning_count: 104, operation_count: 104, hard_gate_count: 17, nominal_wall_clock_target_seconds: 9600, terminal_wall_clock_timeout_seconds: 10500}

