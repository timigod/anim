    - {family_id: "minority_alternate_sequence", operation_group_id: "minority_alternate_sequence", member_ids: ["mixture", "single"], fit_count: 2, operation: "mixture and matched single-sequence comparator"}
    - {family_id: "opposing_sequences_50_50", operation_group_id: "opposing_sequences_50_50", member_ids: ["ordinary"], fit_count: 1, operation: "one non-identifiable ordinary Fit"}
    - {family_id: "near_simultaneous_events", operation_group_id: "near_simultaneous_events", member_ids: ["ordinary"], fit_count: 1, operation: "one partial-order ordinary Fit"}
    - {family_id: "covariate_confounding", operation_group_id: "covariate_confounding", member_ids: ["adjusted", "unadjusted"], fit_count: 2, operation: "adjusted and unadjusted comparator"}
    - {family_id: "group_boundary_sensitivity", operation_group_id: "group_boundary_sensitivity", member_ids: ["q35", "q50", "q65"], fit_count: 3, operation: "q35, q50, and q65 rules"}
    - {family_id: "control_contamination", operation_group_id: "control_contamination", member_ids: ["contaminated", "clean"], fit_count: 2, operation: "contaminated and clean-label comparator"}
    - {family_id: "heavy_tailed_skewed", operation_group_id: "heavy_tailed_skewed", member_ids: ["ordinary"], fit_count: 1, operation: "one ordinary Fit retaining warnings and terminal state"}
    - {family_id: "wrong_event_direction", operation_group_id: "wrong_event_direction", member_ids: ["correct", "wrong"], fit_count: 2, operation: "correct and wrong-direction comparator"}
    - {family_id: "pure_no_signal", operation_group_id: "pure_no_signal", member_ids: ["ordinary"], fit_count: 1, operation: "one ordinary no-signal Fit with cautious language; no statistical qualification"}
    - {family_id: "label_permutation_null", operation_group_id: "label_permutation_null", member_ids: ["transformed_refit"], fit_count: 1, operation: "one complete refit of the shared moderate source"}
    - {family_id: "within_group_feature_permutation_null", operation_group_id: "within_group_feature_permutation_null", member_ids: ["transformed_refit"], fit_count: 1, operation: "one complete refit of the shared moderate source"}
  shared_fit_rules:
    moderate_source_operation_id: "moderate_mina_shape/pair_00/signal"
    moderate_source: "The predeclared moderate_mina_shape/pair_00/signal operation is the authenticated source for both transformation-null operations and is counted once under moderate_mina_shape. It is committed before seed creation and is never selected from results."
    no_hidden_fits: "Validate, report rendering, deterministic replay, and pure derivation do not invoke Fit."

