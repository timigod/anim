  manifest_schema_version: "ebm-audit-proportional-hard-gate-manifest/1.0"
  record_schema_ref: "schemas/proportional-readiness-contract.schema.json#/$defs/HardGateManifestRecord"
  binding_record_schema_ref: "schemas/proportional-readiness-contract.schema.json#/$defs/HardGateEvidenceBindingRecord"
  digest_domain: "ebm-audit/proportional-hard-gate-manifest/1"
  ordered_count: 17
  projection_rule: "Hash the manifest schema version, each ordered gate record, and its one same-ordinal public evidence binding. Gate IDs must match exactly and no extra gate or binding is permitted."
  projection_sha256: "afac7470474815f4f5525d3dcc7782d17b881ba36589d28622bd1868778eb1b7"
  conjunction: "Every listed gate must occur exactly once with schema-valid accepted_state PASS evidence. Missing, duplicate, unchecked, stale, contradictory, WARN, FAIL, or unavailable gate evidence prevents readiness."
  evidence_bindings:
    - {gate_id: "contract_candidate_plan_frozen", required_evidence_owners: ["CANDIDATE_PLAN_FREEZE_RECEIPT"], validation_rule: "Bind the exact non-null contract, meaning inventory, 104-row coverage, registry, proportional schema, candidate tree, conformance EBM, 104-operation challenge plan, expected results, and this 17-row gate-manifest hash before seed creation."}
    - {gate_id: "researcher_workflow_and_handoff", required_evidence_owners: ["FRESH_ENVIRONMENT_HANDOFF_RECEIPT"], validation_rule: "Bind the exact candidate and ordinary public researcher workflow without undeclared state or developer intervention."}
    - {gate_id: "meaning_inventory_complete", required_evidence_owners: ["PROPORTIONAL_OPERATION_PLAN", "MEANING_EVIDENCE_BUNDLE", "REPORT_SURFACE_VERIFICATION_RECEIPT"], validation_rule: "Bind all 104 ordered meanings to all 104 planned operations and exact readback of JSON, applicable CSV, and self-contained HTML."}
    - {gate_id: "substantive_scientific_validation", required_evidence_owners: ["PROPORTIONAL_OPERATION_PLAN", "PUBLIC_TERMINAL_RESULT", "SCIENTIFIC_VALIDATION_RECEIPT"], validation_rule: "Bind every scientific child to the complete plan and exactly one terminal per attempted operation; a process exit or count cannot substitute."}
