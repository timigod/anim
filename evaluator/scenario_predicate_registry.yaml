scenario_predicate_registry:
  schema_path: "schemas/scenario-predicate.schema.json"
  schema_version: "ebm-audit-scenario-predicates/3.0"
  evidence_schema_path: "schemas/scenario-evidence.schema.json"
  evaluation_order: ["validate_family_scoped_evidence","verify_exact_planned_and_valid_coverage","dispatch_exact_versioned_predicate","emit_pass_else_warn_else_fail"]
  totality_rule: "Each predicate ID has one closed implementation over its exact evidence definition. Invalid, missing, duplicate, cross-family, wrong-subtype, non-finite, insufficient-coverage, unknown, or non-terminal evidence emits FAIL; it is never dropped or coerced."
  predicates:
    - {family_id: "easy_known_truth", predicate_id: "easy-known-truth/v2", evidence_schema_ref: "schemas/scenario-family-payload.schema.json#/$defs/EasyKnownTruthEvidence", algorithm: "BOTH_RULE_STATES_PASS_ELSE_BOTH_AT_LEAST_WARN", parameters: {}}
    - {family_id: "moderate_mina_shape", predicate_id: "moderate-matched-null/v2", evidence_schema_ref: "schemas/scenario-family-payload.schema.json#/$defs/ModerateEvidence", algorithm: "AGGREGATE_RULE_STATE_VECTOR", parameters: {"field":"moderate_rule_states","not_assessable_result":"FAIL"}}
    - {family_id: "small_sample", predicate_id: "small-sample-widening/v2", evidence_schema_ref: "schemas/scenario-family-payload.schema.json#/$defs/SmallSampleEvidence", algorithm: "PAIRED_MEDIANS_AND_NO_TRUE_FLAGS", parameters: {"pass_entropy_delta_min":0.1,"pass_cross_chain_delta_min":0.05,"warn_entropy_delta_min":-0.05,"warn_cross_chain_delta_min":-0.05}}
    - {family_id: "noise_ladder", predicate_id: "noise-ladder/v2", evidence_schema_ref: "schemas/scenario-family-payload.schema.json#/$defs/NoiseEvidence", algorithm: "AGGREGATE_RULE_STATE_VECTOR", parameters: {"field":"noise_ladder_rule_states","not_assessable_result":"FAIL"}}
    - {family_id: "weak_pre_post_separation", predicate_id: "weak-separation/v2", evidence_schema_ref: "schemas/scenario-family-payload.schema.json#/$defs/WeakSeparationEvidence", algorithm: "PAIRED_MEDIANS_AND_NO_TRUE_FLAGS", parameters: {"pass_entropy_delta_min":0.1,"pass_kendall_delta_min":0.1,"warn_entropy_delta_min":0,"warn_kendall_delta_min":0}}
    - {family_id: "incomplete_time_coverage", predicate_id: "incomplete-coverage/v2", evidence_schema_ref: "schemas/scenario-family-payload.schema.json#/$defs/IncompleteCoverageEvidence", algorithm: "MEDIAN_AND_ALL_TRUE", parameters: {"pass_median_delta_min":0.1,"warn_median_delta_min":0}}
    - {family_id: "tightly_spaced_events", predicate_id: "tightly-spaced-strict-truth/v2", evidence_schema_ref: "schemas/scenario-family-payload.schema.json#/$defs/TightlySpacedEvidence", algorithm: "TARGET_PAIR_AMBIGUITY_AND_NO_FALSE_PRECISION", parameters: {"pass_precedence_interval":[0.25,0.75],"pass_fraction_min":0.6,"warn_precedence_interval":[0.25,0.75],"warn_fraction_min":0.4,"required_truth_scoring_mode":"STRICT_TOTAL_ORDER"}}
    - {family_id: "slow_overlapping_transitions", predicate_id: "slow-overlap/v2", evidence_schema_ref: "schemas/scenario-family-payload.schema.json#/$defs/SlowTransitionEvidence", algorithm: "PAIRED_MEDIANS", parameters: {"pass_entropy_delta_min":0.1,"pass_kendall_delta_min":0.1,"warn_entropy_delta_min":0,"warn_kendall_delta_min":0}}
    - {family_id: "outlier_sabotage", predicate_id: "outlier-influence/v2", evidence_schema_ref: "schemas/scenario-family-payload.schema.json#/$defs/OutlierEvidence", algorithm: "RULE_STATE_VECTOR_AND_NO_TRUE_FLAGS", parameters: {"state_field":"influence_rule_states","claim_flag_field":"bad_or_wrong_data_claim_flags"}}
    - {family_id: "mcar_missingness", predicate_id: "mcar-accounting/v2", evidence_schema_ref: "schemas/scenario-family-payload.schema.json#/$defs/McarEvidence", algorithm: "MCAR_EXACT_ACCOUNTING", parameters: {}}
    - {family_id: "mar_missingness", predicate_id: "mar-accounting/v2", evidence_schema_ref: "schemas/scenario-family-payload.schema.json#/$defs/MarEvidence", algorithm: "MAR_EXACT_ACCOUNTING", parameters: {}}
    - {family_id: "correlated_duplicate_events", predicate_id: "correlated-and-exact-duplicate/v2", evidence_schema_ref: "schemas/scenario-family-payload.schema.json#/$defs/CorrelatedDuplicateEvidence", algorithm: "SUBTYPE_AMBIGUITY_AND_NO_FALSE_PRECISION", parameters: {"correlated_count":6,"correlated_required_truth_scoring_mode":"STRICT_TOTAL_ORDER","correlated_pass_precedence_interval":[0.25,0.75],"correlated_pass_fraction_min":0.6,"correlated_warn_precedence_interval":[0.25,0.75],"correlated_warn_fraction_min":0.4,"exact_duplicate_count":6,"exact_duplicate_required_truth_scoring_mode":"PARTIAL_ORDER_EQUIVALENCE","exact_duplicate_pass_precedence_interval":[0.25,0.75],"exact_duplicate_pass_fraction_min":0.8,"exact_duplicate_warn_precedence_interval":[0.2,0.8],"exact_duplicate_warn_fraction_min":0.7}}
    - {family_id: "minority_alternate_sequence", predicate_id: "minority-alternate/v2", evidence_schema_ref: "schemas/scenario-family-payload.schema.json#/$defs/MinorityAlternateEvidence", algorithm: "LIMITATION_ALL_TRUE_AND_MEDIAN_DELTA", parameters: {"pass_median_entropy_delta_min":0,"required_truth_scoring_mode":"MIXTURE_NON_IDENTIFIABLE"}}
    - {family_id: "opposing_sequences_50_50", predicate_id: "opposing-sequences/v2", evidence_schema_ref: "schemas/scenario-family-payload.schema.json#/$defs/OpposingEvidence", algorithm: "NONIDENTIFIABLE_MEAN_HALF_DISTANCE_AND_NO_STRONG_FLAGS", parameters: {"pass_mean_half_distance_max":0.2,"warn_mean_half_distance_max":0.3,"required_truth_scoring_mode":"MIXTURE_NON_IDENTIFIABLE"}}
    - {family_id: "near_simultaneous_events", predicate_id: "near-simultaneous-block/v2", evidence_schema_ref: "schemas/scenario-family-payload.schema.json#/$defs/NearSimultaneousEvidence", algorithm: "PARTIAL_BLOCK_PRECEDENCE_FRACTION", parameters: {"pass_interval":[0.25,0.75],"pass_fraction_min":0.8,"warn_interval":[0.25,0.75],"warn_fraction_min":0.6,"required_truth_scoring_mode":"PARTIAL_ORDER_EQUIVALENCE"}}
    - {family_id: "covariate_confounding", predicate_id: "covariate-reference-only/v2", evidence_schema_ref: "schemas/scenario-family-payload.schema.json#/$defs/CovariateEvidence", algorithm: "COVARIATE_PAIRED_AND_NO_LEAKAGE", parameters: {"pass_median_delta_min":0.1,"pass_positive_fraction_min":0.6,"warn_median_delta_min":-0.05}}
    - {family_id: "group_boundary_sensitivity", predicate_id: "group-boundary/v2", evidence_schema_ref: "schemas/scenario-family-payload.schema.json#/$defs/GroupBoundaryEvidence", algorithm: "EXACT_BOUNDARY_ACCOUNTING", parameters: {}}
    - {family_id: "control_contamination", predicate_id: "control-contamination/v2", evidence_schema_ref: "schemas/scenario-family-payload.schema.json#/$defs/ControlContaminationEvidence", algorithm: "SPEARMAN_TRENDS_AND_ALL_LABEL_BINDINGS", parameters: {"pass_kendall_rho_max":-0.4,"pass_entropy_rho_min":0.4,"warn_kendall_rho_max":0,"warn_entropy_rho_min":0}}
    - {family_id: "heavy_tailed_skewed", predicate_id: "heavy-tail-honesty/v2", evidence_schema_ref: "schemas/scenario-family-payload.schema.json#/$defs/HeavyTailEvidence", algorithm: "ZERO_HIDDEN_CHANGES_AND_COMPLETE_TERMINALS", parameters: {}}
    - {family_id: "wrong_event_direction", predicate_id: "direction-sensitivity/v2", evidence_schema_ref: "schemas/scenario-family-payload.schema.json#/$defs/WrongDirectionEvidence", algorithm: "DIRECTION_PAIRED_AND_NO_VALIDITY_CLAIMS", parameters: {"pass_median_delta_min":0.15,"pass_report_fraction_min":0.8,"warn_median_delta_min":0.05,"warn_report_fraction_min":0.7}}
    - {family_id: "pure_no_signal", predicate_id: "pure-no-signal-fpr/v2", evidence_schema_ref: "schemas/scenario-family-payload.schema.json#/$defs/PureNoSignalEvidence", algorithm: "DERIVE_COMPLETE_FPR_EVIDENCE", parameters: {"opportunity_count":60,"not_assessable_count_max":0}}
    - {family_id: "label_permutation_null", predicate_id: "label-permutation/v2", evidence_schema_ref: "schemas/scenario-family-payload.schema.json#/$defs/LabelPermutationEvidence", algorithm: "ALL_TRANSFORMATION_INVARIANTS_AND_NO_INELIGIBLE_STRONG", parameters: {}}
    - {family_id: "within_group_feature_permutation_null", predicate_id: "feature-permutation/v2", evidence_schema_ref: "schemas/scenario-family-payload.schema.json#/$defs/FeaturePermutationEvidence", algorithm: "ALL_FEATURE_TRANSFORMATION_INVARIANTS_AND_NO_INELIGIBLE_STRONG", parameters: {}}
